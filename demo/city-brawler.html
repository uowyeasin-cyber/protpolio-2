<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>City Brawler · Browser Game · by Yeasin Arafat</title>
<meta name="description" content="City Brawler, the first version of Neon Battle City. A JavaScript fighting game you can play free in your browser. Made by Yeasin Arafat.">
<meta name="author" content="Yeasin Arafat">
<link rel="canonical" href="https://yeasinarafatbd.vercel.app/demo/city-brawler.html">
<meta property="og:title" content="City Brawler · Browser Game · by Yeasin Arafat">
<meta property="og:description" content="City Brawler, the first version of Neon Battle City. A JavaScript fighting game you can play free in your browser. Made by Yeasin Arafat.">
<meta property="og:url" content="https://yeasinarafatbd.vercel.app/demo/city-brawler.html">
<meta property="og:image" content="https://yeasinarafatbd.vercel.app/img/og.jpg">
<meta name="twitter:card" content="summary_large_image">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #0b1a2f;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }
    .game-container {
      background: #172a3a;
      padding: clamp(10px, 2.5vw, 20px) clamp(10px, 3vw, 30px) clamp(14px, 3vw, 30px);
      width: 100%;
      max-width: 960px;
      border-radius: 48px 48px 28px 28px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.7), inset 0 0 0 2px #3f6b8c;
      border-bottom: 6px solid #f7c948;
    }
    canvas {
      display: block;
      margin: 0 auto;
      width: 100%;
      max-width: 900px;
      height: auto;
      aspect-ratio: 9 / 5;
      touch-action: manipulation;
      border-radius: 28px;
      box-shadow: 0 0 0 3px #2d4b63, 0 12px 28px rgba(0,0,0,0.8);
      background: transparent; /* bg drawn on canvas */
      cursor: crosshair;
    }
    .status-panel {
      margin-top: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      background: #0f212f;
      padding: 12px 24px;
      border-radius: 60px;
      border: 1px solid #4c7b9c;
      box-shadow: inset 0 4px 6px rgba(0,0,0,0.6);
      color: #d4edff;
      font-weight: bold;
      text-shadow: 0 2px 0 #0a141f;
    }
    .level-box {
      background: #2d4f69;
      padding: 6px 22px;
      border-radius: 40px;
      font-size: 1.5rem;
      letter-spacing: 2px;
      color: #ffe484;
      box-shadow: inset 0 -3px 0 #1b3140;
    }
    .win-counter {
      background: #1f3d51;
      padding: 6px 24px;
      border-radius: 40px;
      display: flex;
      gap: 20px;
    }
    .win-counter span {
      background: #0e212f;
      padding: 0 14px;
      border-radius: 30px;
      color: #b3e4ff;
    }
    button {
      background: #f5c542;
      border: none;
      font-weight: bold;
      font-size: 1.1rem;
      padding: 8px 26px;
      border-radius: 40px;
      color: #141f2b;
      box-shadow: 0 6px 0 #a07d2c, 0 4px 12px black;
      transition: 0.05s linear;
      cursor: pointer;
      letter-spacing: 1px;
    }
    button:active {
      transform: translateY(6px);
      box-shadow: 0 1px 0 #a07d2c;
    }
    .hint {
      color: #88b6d6;
      margin-top: 8px;
      text-align: center;
      font-size: 0.9rem;
      background: #0b1c28;
      padding: 6px 12px;
      border-radius: 30px;
      display: inline-block;
      margin-left: auto;
      margin-right: auto;
      width: fit-content;
      border: 1px solid #386482;
    }
  </style>
</head>
<body>
<div class="game-container">
  <canvas id="gameCanvas" width="900" height="500"></canvas>

  <div class="status-panel">
    <div class="level-box">🏆 LEVEL <span id="levelDisplay">1</span></div>
    <div class="win-counter">🏅 WINS <span id="winDisplay">0</span>  🎯 <span id="nextLevelHint">NEXT ↑</span></div>
    <button id="resetBtn">⚡ NEW GAME</button>
  </div>
  <div class="hint">⚔️ CLICK ON ENEMY TO ATTACK · WIN TO UNLOCK NEXT LEVEL</div>
</div>

<script>
  (function() {
    // ----- CANVAS & CONTEXT -----
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // ----- UI ELEMENTS -----
    const levelSpan = document.getElementById('levelDisplay');
    const winSpan = document.getElementById('winDisplay');
    const nextHint = document.getElementById('nextLevelHint');

    // ----- GAME STATE -----
    let currentLevel = 1;            // starts at 1, unlimited
    let winCount = 0;               // total wins (persistent)
    let enemyHP = 100;             // current enemy health
    let maxHP = 100;              // base max HP (scales with level)
    let isEnemyAlive = true;
    let gameOver = false;          // true when enemy dies (win state)
    let winStreak = 0;            // consecutive wins for level up

    // ----- ANIMATION / CITY ELEMENTS (PUBG + ocean + city vibe) -----
    // buildings, ocean wave offset, lights, particles
    let time = 0;
    let cityLights = [];

    // generate random building data (static, but animated with time)
    function generateCity() {
      const buildings = [];
      for (let i = 0; i < 32; i++) {
        const x = 20 + i * 28 + Math.random() * 8;
        const w = 14 + Math.random() * 24;
        const h = 40 + Math.random() * 100;
        const color = `hsl(${210 + Math.random() * 30}, ${40 + Math.random() * 30}%, ${30 + Math.random() * 30}%)`;
        const windows = Math.floor((h / 20) * (w / 10)) + 2;
        buildings.push({ x, w, h, color, windows, lit: Math.random() > 0.4 });
      }
      return buildings;
    }
    let buildings = generateCity();

    // ocean waves (moving)
    function drawOcean(baseY) {
      ctx.save();
      ctx.beginPath();
      ctx.rect(0, baseY, 900, 500 - baseY);
      ctx.fillStyle = '#0d3b4f';
      ctx.fill();
      // wave layers
      for (let layer = 0; layer < 3; layer++) {
        ctx.beginPath();
        ctx.moveTo(0, baseY + 20 + layer * 12);
        for (let x = 0; x <= 900; x += 6) {
          const y = baseY + 20 + layer * 12 + 
                    Math.sin(x * 0.015 + time * 0.02 + layer * 2) * 10 +
                    Math.sin(x * 0.03 + time * 0.03 + layer) * 5;
          ctx.lineTo(x, y);
        }
        ctx.lineTo(900, baseY + 70);
        ctx.lineTo(0, baseY + 70);
        ctx.closePath();
        ctx.fillStyle = `rgba(30, 110, 140, ${0.2 + layer * 0.08})`;
        ctx.fill();
        ctx.strokeStyle = `rgba(180, 225, 255, ${0.08})`;
        ctx.lineWidth = 1.5;
        ctx.stroke();
      }
      // sun reflection
      ctx.beginPath();
      ctx.arc(780, baseY + 32, 28, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255, 200, 100, 0.15)';
      ctx.fill();
      ctx.restore();
    }

    // ----- DRAW CITY + OCEAN + PUBG STYLE (animated) -----
    function drawCityBackground() {
      // sky gradient (PUBG style dusk)
      const grad = ctx.createLinearGradient(0, 0, 0, 350);
      grad.addColorStop(0, '#1a3045');
      grad.addColorStop(0.5, '#2b4d6b');
      grad.addColorStop(1, '#4d7b9e');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 900, 350);

      // draw buildings (city view)
      buildings.forEach(b => {
        const yBase = 320 - b.h;
        ctx.fillStyle = b.color;
        ctx.shadowColor = 'rgba(0,0,0,0.3)';
        ctx.shadowBlur = 8;
        ctx.fillRect(b.x, yBase, b.w, b.h);
        ctx.shadowBlur = 0;
        // windows (animated blink)
        const winCount = Math.floor(b.w / 8) * Math.floor(b.h / 16);
        for (let i = 0; i < winCount; i++) {
          const wx = b.x + 4 + (i % Math.floor(b.w / 8)) * 9;
          const wy = yBase + 8 + Math.floor(i / Math.floor(b.w / 8)) * 14;
          const lit = (b.lit && Math.sin(time * 0.005 + i + b.x) > 0.1) || 
                      (Math.sin(time * 0.01 + i * 2 + b.x) > 0.7);
          ctx.fillStyle = lit ? '#f9e57c' : '#263b4a';
          ctx.fillRect(wx, wy, 5, 7);
        }
        // roof detail
        ctx.fillStyle = 'rgba(30,40,50,0.4)';
        ctx.fillRect(b.x+2, yBase-2, b.w-4, 4);
      });

      // ocean (bottom)
      drawOcean(320);

      // some flying particles / birds (animated)
      ctx.fillStyle = 'rgba(200,210,220,0.4)';
      for (let i=0; i<12; i++) {
        const x = (time * 0.2 + i * 70) % 900;
        const y = 60 + Math.sin(time * 0.02 + i) * 20 + i * 4;
        ctx.beginPath();
        ctx.arc(x, y, 2 + Math.sin(time*0.1+i)*1, 0, Math.PI*2);
        ctx.fill();
      }
    }

    // ----- DRAW PLAYER & ENEMY (PUBG style fighters) -----
    function drawFighters() {
      // player (left side) – hero
      ctx.save();
      ctx.shadowColor = '#8fcbff';
      ctx.shadowBlur = 20;
      // body
      ctx.fillStyle = '#2b7a9c';
      ctx.beginPath();
      ctx.ellipse(130, 360, 26, 40, 0, 0, Math.PI*2);
      ctx.fill();
      ctx.fillStyle = '#4a9bc4';
      ctx.beginPath();
      ctx.ellipse(130, 330, 18, 22, 0, 0, Math.PI*2);
      ctx.fill();
      // head
      ctx.fillStyle = '#f7d9b0';
      ctx.beginPath();
      ctx.arc(130, 300, 20, 0, Math.PI*2);
      ctx.fill();
      // helmet / hat
      ctx.fillStyle = '#3d5f7a';
      ctx.beginPath();
      ctx.ellipse(130, 285, 24, 10, 0, 0, Math.PI*2);
      ctx.fill();
      // eyes
      ctx.fillStyle = '#1f1f2a';
      ctx.beginPath();
      ctx.arc(120, 296, 4, 0, Math.PI*2);
      ctx.arc(140, 296, 4, 0, Math.PI*2);
      ctx.fill();
      ctx.fillStyle = 'white';
      ctx.beginPath();
      ctx.arc(118, 293, 1.8, 0, Math.PI*2);
      ctx.arc(138, 293, 1.8, 0, Math.PI*2);
      ctx.fill();
      // weapon (melee)
      ctx.strokeStyle = '#a0b8c0';
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.moveTo(150, 350);
      ctx.lineTo(180, 320);
      ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.restore();

      // ENEMY (right side) – with HP bar
      const enemyX = 750;
      ctx.save();
      // enemy body (dark)
      ctx.shadowColor = '#ff6a4b';
      ctx.shadowBlur = 16;
      ctx.fillStyle = '#7a3e2a';
      ctx.beginPath();
      ctx.ellipse(enemyX, 360, 28, 42, 0, 0, Math.PI*2);
      ctx.fill();
      ctx.fillStyle = '#aa5a3a';
      ctx.beginPath();
      ctx.ellipse(enemyX, 330, 20, 24, 0, 0, Math.PI*2);
      ctx.fill();
      // head
      ctx.fillStyle = '#dbaa7a';
      ctx.beginPath();
      ctx.arc(enemyX, 300, 22, 0, Math.PI*2);
      ctx.fill();
      // mask / bandana
      ctx.fillStyle = '#6d2e1a';
      ctx.beginPath();
      ctx.ellipse(enemyX, 300, 24, 12, 0, 0, Math.PI*2);
      ctx.fill();
      // angry eyes
      ctx.fillStyle = '#f0f0f0';
      ctx.beginPath();
      ctx.arc(enemyX-10, 294, 7, 0, Math.PI*2);
      ctx.arc(enemyX+10, 294, 7, 0, Math.PI*2);
      ctx.fill();
      ctx.fillStyle = '#c0321a';
      ctx.beginPath();
      ctx.arc(enemyX-10, 294, 4, 0, Math.PI*2);
      ctx.arc(enemyX+10, 294, 4, 0, Math.PI*2);
      ctx.fill();
      ctx.fillStyle = 'black';
      ctx.beginPath();
      ctx.arc(enemyX-12, 292, 2, 0, Math.PI*2);
      ctx.arc(enemyX+8, 292, 2, 0, Math.PI*2);
      ctx.fill();

      // enemy weapon (club)
      ctx.strokeStyle = '#4f3a2a';
      ctx.lineWidth = 10;
      ctx.beginPath();
      ctx.moveTo(enemyX-30, 340);
      ctx.lineTo(enemyX-60, 310);
      ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.restore();

      // enemy HP bar (above enemy)
      const hpPercent = Math.max(0, enemyHP / maxHP);
      ctx.fillStyle = '#1f1f2a';
      ctx.fillRect(enemyX-60, 230, 120, 18);
      ctx.fillStyle = hpPercent > 0.5 ? '#4cd964' : '#ff5e3a';
      ctx.fillRect(enemyX-58, 232, 116 * hpPercent, 14);
      ctx.strokeStyle = '#b0c4d9';
      ctx.lineWidth = 2;
      ctx.strokeRect(enemyX-60, 230, 120, 18);
      ctx.fillStyle = '#d9e6f2';
      ctx.font = 'bold 12px monospace';
      ctx.fillText(`HP ${Math.ceil(enemyHP)}`, enemyX-28, 247);
    }

    // ----- GAME MECHANICS -----
    let nextEnemyTimer = null;
    function resetEnemy() {
      // scale HP with level: each level + 20% more health (unlimited scaling)
      maxHP = Math.floor(100 + (currentLevel - 1) * 25);
      enemyHP = maxHP;
      isEnemyAlive = true;
      gameOver = false;
    }

    // Attack (called on canvas click)
    function playerAttack() {
      if (!isEnemyAlive || gameOver) return false; // already dead

      // damage based on level (slight boost)
      const baseDamage = 12 + Math.floor(currentLevel * 2.2);
      const crit = Math.random() > 0.7 ? 1.6 : 1.0;
      let damage = Math.floor(baseDamage * crit);
      enemyHP = Math.max(0, enemyHP - damage);

      // animation feedback: flash
      if (enemyHP <= 0) {
        enemyHP = 0;
        isEnemyAlive = false;
        gameOver = true;
        winCount++;
        winStreak++;
        winSpan.textContent = winCount;

        // LEVEL UP: if winStreak >= 1 (always level up after win)
        // but only if enemy died (win)
        if (isEnemyAlive === false) {
          // level up always (unlimited)
          currentLevel++;
          levelSpan.textContent = currentLevel;
          // unlock next level (show hint)
          nextHint.textContent = '⬆ NEXT UNLOCKED!';
          setTimeout(() => {
            nextHint.textContent = '⚔️ FIGHT!';
          }, 1200);
          // show VICTORY for a moment, then bring in the next enemy
          clearTimeout(nextEnemyTimer);
          nextEnemyTimer = setTimeout(() => {
            resetEnemy();
            buildings = generateCity();
          }, 1400);
          // update win streak (show)
        }
        return true; // kill
      }
      return false;
    }

    // Reset game (keep level & wins)
    function resetGame() {
      clearTimeout(nextEnemyTimer);
      currentLevel = 1;
      winCount = 0;
      winStreak = 0;
      levelSpan.textContent = currentLevel;
      winSpan.textContent = '0';
      resetEnemy();
      buildings = generateCity();
      nextHint.textContent = '⚔️ FIGHT!';
    }

    // ----- CANVAS CLICK (attack) -----
    canvas.addEventListener('click', (e) => {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      const mouseX = (e.clientX - rect.left) * scaleX;
      const mouseY = (e.clientY - rect.top) * scaleY;

      // hit area: enemy body (approx 700-820 x 260-400)
      if (mouseX > 700 && mouseX < 820 && mouseY > 260 && mouseY < 420) {
        playerAttack(); // the animation loop redraws on its own
      } else {
        // miss feedback (optional)
        nextHint.textContent = '👊 ATTACK ENEMY!';
        setTimeout(() => { if (!gameOver) nextHint.textContent = '⚔️ FIGHT!'; }, 400);
      }
    });

    // reset button
    document.getElementById('resetBtn').addEventListener('click', () => {
      resetGame();
    });

    // ----- ANIMATION LOOP (PUBG + ocean + city) -----
    function drawFrame() {
      ctx.clearRect(0, 0, 900, 500);
      // background city + ocean
      drawCityBackground();

      // draw fighters
      drawFighters();

      // UI overlays / messages
      if (gameOver && isEnemyAlive === false) {
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.fillRect(0, 0, 900, 500);
        ctx.fillStyle = '#ffe484';
        ctx.font = 'bold 46px system-ui';
        ctx.shadowColor = '#000';
        ctx.shadowBlur = 20;
        ctx.fillText('🏆 VICTORY', 300, 170);
        ctx.shadowBlur = 0;
        ctx.font = '24px monospace';
        ctx.fillStyle = '#d4edff';
        ctx.fillText('LEVEL UP!', 380, 240);
      }

      // ocean animation update
      time += 0.5;
      requestAnimationFrame(drawFrame);
    }

    // init
    resetEnemy();
    drawFrame();
  })();
</script>
</body>
</html>

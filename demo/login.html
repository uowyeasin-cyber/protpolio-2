<html lang="en">
<head>

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap"><style>* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;
}

body {
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  background: linear-gradient(135deg, #4a1a6c, #7b2cbf, #241242);
}

.container {
  position: relative;
  width: 850px;
  height: 550px;
  background: #fff;
  border-radius: 30px;
  box-shadow: 0 0 30px rgba(0, 0, 0, 0.3);
  overflow: hidden;
}

/* ---------- Forms ---------- */
.form-box {
  position: absolute;
  right: 0;
  width: 50%;
  height: 100%;
  background: #fff;
  display: flex;
  align-items: center;
  color: #333;
  text-align: center;
  padding: 40px;
  z-index: 1;
  transition: 0.6s ease-in-out 1.2s, visibility 0s 1s;
}

.container.active .form-box {
  right: 50%;
}

.form-box.register {
  visibility: hidden;
}

.container.active .form-box.register {
  visibility: visible;
}

form {
  width: 100%;
}

.container h1 {
  font-size: 34px;
  margin-bottom: 10px;
  color: #7b2cbf;
}

.input-box {
  position: relative;
  margin: 24px 0;
}

.input-box input {
  width: 100%;
  padding: 13px 45px 13px 18px;
  background: #eee;
  border-radius: 8px;
  border: none;
  outline: none;
  font-size: 15px;
  color: #333;
}

.input-box input::placeholder {
  color: #888;
}

.input-box i {
  position: absolute;
  right: 16px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 18px;
  color: #7b2cbf;
}

.forgot-link {
  margin: -12px 0 16px;
  text-align: right;
}

.forgot-link a {
  font-size: 13px;
  color: #666;
  text-decoration: none;
}

.forgot-link a:hover {
  color: #7b2cbf;
}

.btn {
  width: 100%;
  height: 46px;
  background: #7b2cbf;
  border-radius: 8px;
  border: none;
  cursor: pointer;
  color: #fff;
  font-size: 15px;
  font-weight: 600;
  letter-spacing: 0.5px;
  transition: background 0.3s;
}

.btn:hover {
  background: #611fa0;
}

.container p {
  font-size: 13px;
  margin: 16px 0;
  color: #666;
}

.social-icons {
  display: flex;
  justify-content: center;
  gap: 12px;
}

.social-icons a {
  display: inline-flex;
  padding: 9px;
  border: 1px solid #ccc;
  border-radius: 8px;
  font-size: 20px;
  color: #7b2cbf;
  text-decoration: none;
  transition: border-color 0.3s;
}

.social-icons a:hover {
  border-color: #7b2cbf;
}

/* ---------- Toggle panel ---------- */
.toggle-box {
  position: absolute;
  width: 100%;
  height: 100%;
}

.toggle-box::before {
  content: '';
  position: absolute;
  left: -250%;
  width: 300%;
  height: 100%;
  background: linear-gradient(135deg, #7b2cbf, #4a1a6c);
  border-radius: 150px;
  z-index: 2;
  transition: 1.8s ease-in-out;
}

.container.active .toggle-box::before {
  left: 50%;
}

.toggle-panel {
  position: absolute;
  width: 50%;
  height: 100%;
  color: #fff;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 0 40px;
  z-index: 2;
  transition: 0.6s ease-in-out;
}

.toggle-panel h1 {
  color: #fff;
}

.toggle-panel p {
  color: #eee;
  margin-bottom: 20px;
}

.toggle-left {
  left: 0;
  transition-delay: 1.2s;
}

.container.active .toggle-left {
  left: -50%;
  transition-delay: 0.6s;
}

.toggle-right {
  right: -50%;
  transition-delay: 0.6s;
}

.container.active .toggle-right {
  right: 0;
  transition-delay: 1.2s;
}

.toggle-panel .btn {
  width: 160px;
  height: 46px;
  background: transparent;
  border: 2px solid #fff;
}

.toggle-panel .btn:hover {
  background: #fff;
  color: #7b2cbf;
}

/* ---------- Responsive ---------- */
@media (max-width: 650px) {
  .container {
    width: 94vw;
    height: 90vh;
  }

  .form-box {
    padding: 24px;
  }

  .toggle-panel h1 {
    font-size: 26px;
  }

  .container h1 {
    font-size: 26px;
  }
}

.ic{width:18px;height:18px}.social-icons .ic{width:20px;height:20px}.input-box .ic{position:absolute;right:16px;top:50%;transform:translateY(-50%);color:#7b2cbf}
body{padding:16px}.container{max-width:100%}</style>
  
</head>
<body>

        </div>

        </div>

          <a href="#"><svg class="ic" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M14 8V6c0-.9.6-1 1-1h2.5V1.5H14c-3.3 0-4 2.4-4 4V8H7.5v3.7H10V22h4V11.7h3l.5-3.7z"/></svg></a>
          <a href="#"><svg class="ic" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-3.2 19.5c.5.1.7-.2.7-.5v-1.7c-2.8.6-3.4-1.3-3.4-1.3-.4-1.2-1.1-1.5-1.1-1.5-.9-.6.1-.6.1-.6 1 .1 1.5 1 1.5 1 .9 1.5 2.4 1.1 2.9.8.1-.6.4-1.1.6-1.3-2.2-.3-4.6-1.1-4.6-5 0-1.1.4-2 1-2.7-.1-.3-.4-1.3.1-2.7 0 0 .8-.3 2.8 1a9.6 9.6 0 0 1 5 0c1.9-1.3 2.8-1 2.8-1 .5 1.4.2 2.4.1 2.7.6.7 1 1.6 1 2.7 0 3.9-2.3 4.7-4.6 5 .4.3.7.9.7 1.9V21c0 .3.2.6.7.5A10 10 0 0 0 12 2z"/></svg></a>
          <a href="#"><svg class="ic" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4.98 3.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5zM3 9.5h4V21H3zm6.5 0h3.8v1.6h.1c.5-1 1.8-2 3.8-2 4 0 4.8 2.6 4.8 6V21h-4v-5.2c0-1.2 0-2.9-1.8-2.9s-2 1.4-2 2.8V21h-4z"/></svg></a>
        </div>
      </form>
    </div>

    <!-- Registration form -->
    <div class="form-box register">
      <form action="#">
        <h1>Registration</h1>
        <div class="input-box">
          <input type="text" placeholder="Username" required>
          <svg class="ic" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10zm0 2c-4.4 0-8 2.2-8 5v3h16v-3c0-2.8-3.6-5-8-5z"/></svg>
        </div>
        <div class="input-box">
          <input type="email" placeholder="Email" required>
          <svg class="ic" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M2 5h20v2l-10 6L2 7zm0 4.3 10 6 10-6V19H2z"/></svg>
        </div>
        <div class="input-box">
          <input type="password" placeholder="Password" required>
          <svg class="ic" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17 9V7A5 5 0 0 0 7 7v2H5v13h14V9zm-8-2a3 3 0 0 1 6 0v2H9z"/></svg>
        </div>
        <button type="submit" class="btn">Register</button>
        <p>or register with social platforms</p>
        <div class="social-icons">
          <a href="#"><svg class="ic" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21.6 12.2c0-.7-.1-1.4-.2-2H12v3.8h5.4a4.6 4.6 0 0 1-2 3v2.5h3.2c1.9-1.7 3-4.3 3-7.3zM12 22c2.7 0 5-.9 6.6-2.4l-3.2-2.5c-.9.6-2 1-3.4 1-2.6 0-4.8-1.8-5.6-4.1H3.1v2.6A10 10 0 0 0 12 22zM6.4 14a6 6 0 0 1 0-3.9V7.5H3.1a10 10 0 0 0 0 9zM12 6c1.5 0 2.8.5 3.8 1.5l2.9-2.9A10 10 0 0 0 3.1 7.5l3.3 2.6C7.2 7.8 9.4 6 12 6z"/></svg></a>
          <a href="#"><svg class="ic" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M14 8V6c0-.9.6-1 1-1h2.5V1.5H14c-3.3 0-4 2.4-4 4V8H7.5v3.7H10V22h4V11.7h3l.5-3.7z"/></svg></a>
          <a href="#"><svg class="ic" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-3.2 19.5c.5.1.7-.2.7-.5v-1.7c-2.8.6-3.4-1.3-3.4-1.3-.4-1.2-1.1-1.5-1.1-1.5-.9-.6.1-.6.1-.6 1 .1 1.5 1 1.5 1 .9 1.5 2.4 1.1 2.9.8.1-.6.4-1.1.6-1.3-2.2-.3-4.6-1.1-4.6-5 0-1.1.4-2 1-2.7-.1-.3-.4-1.3.1-2.7 0 0 .8-.3 2.8 1a9.6 9.6 0 0 1 5 0c1.9-1.3 2.8-1 2.8-1 .5 1.4.2 2.4.1 2.7.6.7 1 1.6 1 2.7 0 3.9-2.3 4.7-4.6 5 .4.3.7.9.7 1.9V21c0 .3.2.6.7.5A10 10 0 0 0 12 2z"/></svg></a>
          <a href="#"><svg class="ic" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4.98 3.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5zM3 9.5h4V21H3zm6.5 0h3.8v1.6h.1c.5-1 1.8-2 3.8-2 4 0 4.8 2.6 4.8 6V21h-4v-5.2c0-1.2 0-2.9-1.8-2.9s-2 1.4-2 2.8V21h-4z"/></svg></a>
        </div>
      </form>
    </div>

    <!-- Sliding toggle panel -->
    <div class="toggle-box">
      <div class="toggle-panel toggle-left">
        <h1>Hello, Welcome!</h1>
        <p>Don't have an account?</p>
        <button class="btn register-btn" id="register-btn">Register</button>
      </div>

      <div class="toggle-panel toggle-right">
        <h1>Welcome Back!</h1>
        <p>Already have an account?</p>
        <button class="btn login-btn" id="login-btn">Login</button>
      </div>
    </div>

  </div>

  <script>const container = document.getElementById('container');
const registerBtn = document.getElementById('register-btn');
const loginBtn = document.getElementById('login-btn');

registerBtn.addEventListener('click', () => {
  container.classList.add('active');
});

loginBtn.addEventListener('click', () => {
  container.classList.remove('active');
});

document.querySelectorAll("form").forEach(f=>f.addEventListener("submit",e=>e.preventDefault()));document.querySelectorAll("a[href='#']").forEach(a=>a.addEventListener("click",e=>e.preventDefault()));</script>
</body>
</html>

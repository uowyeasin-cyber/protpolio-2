<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tic Tac Toe: Unbeatable AI · Free Browser Game · by Yeasin Arafat</title>
<meta name="description" content="Play Tic Tac Toe against an unbeatable minimax AI with unlimited levels and animated themes. Free in your browser. Made by Yeasin Arafat.">
<meta name="author" content="Yeasin Arafat">
<link rel="canonical" href="https://yeasinarafatbd.vercel.app/demo/tictactoe.html">
<meta property="og:title" content="Tic Tac Toe: Unbeatable AI · Free Browser Game · by Yeasin Arafat">
<meta property="og:description" content="Play Tic Tac Toe against an unbeatable minimax AI with unlimited levels and animated themes. Free in your browser. Made by Yeasin Arafat.">
<meta property="og:url" content="https://yeasinarafatbd.vercel.app/demo/tictactoe.html">
<meta property="og:image" content="https://yeasinarafatbd.vercel.app/img/og.jpg">
<meta name="twitter:card" content="summary_large_image">

  <style>
    /* ===================================================================
       GLOBAL RESET
    =================================================================== */
    * {
      box-sizing: border-box;
    }

    /* ===================================================================
       BODY - CSS variable (--bg1, --bg2, --accent) diye color control.
       Level barar shathe shathe theme (city/ocean/desert/snow/space)
       cycle kore change hobe, tai body-r background eki system e thakbe
    =================================================================== */
    body {
      --bg1: #0d0d1a;
      --bg2: #1b1b33;
      --accent: #ffcd05;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: linear-gradient(180deg, var(--bg1), var(--bg2));
      font-family: Arial, sans-serif;
      color: white;
      overflow: hidden;
      position: relative;
      transition: background 0.8s ease;
    }

    /* ===================================================================
       BACKGROUND SCENE CONTAINER
       Ei ekta container-e shob theme-er shape (building/wave/dune/
       mountain/star) bosano hobe. Level change hole innerHTML clear
       kore notun theme-er shape gulo diye abar bhorbo.
    =================================================================== */
    .scene {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 200%;
      height: 200px;
      display: flex;
      align-items: flex-end;
      z-index: 0;
      animation: sceneScroll 40s linear infinite; /* dhire dhire pashe scroll - parallax feel */
      opacity: 0.9;
    }
    @keyframes sceneScroll {
      from { transform: translateX(0); }
      to   { transform: translateX(-50%); }
    }

    /* ---- CITY THEME shapes ---- */
    .building {
      position: relative;
      background: #111122;
      margin-right: 4px;
      border-top: 2px solid rgba(255,255,255,0.05);
    }
    .window {
      position: absolute;
      width: 5px;
      height: 7px;
      background: var(--accent);
      opacity: 0.15;
      animation: windowFlicker 4s ease-in-out infinite;
    }
    @keyframes windowFlicker {
      0%, 100% { opacity: 0.15; }
      50%      { opacity: 0.9; }
    }

    /* ---- OCEAN THEME shapes ---- */
    .wave {
      position: absolute;
      bottom: 0;
      width: 220%;
      height: 60px;
      border-radius: 45%;
      background: rgba(0, 200, 255, 0.18);
      animation: waveMove 8s linear infinite;
    }
    @keyframes waveMove {
      from { transform: translateX(0) translateY(0); }
      to   { transform: translateX(-25%) translateY(0); }
    }

    /* ---- DESERT THEME shapes ---- */
    .dune {
      position: absolute;
      bottom: -20px;
      width: 260px;
      height: 90px;
      border-radius: 50%;
      background: rgba(255, 190, 90, 0.25);
    }
    .sun {
      position: fixed;
      top: 40px;
      right: 60px;
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 40px var(--accent), 0 0 80px var(--accent);
      z-index: 0;
      animation: sunPulse 3s ease-in-out infinite;
    }
    @keyframes sunPulse {
      0%, 100% { opacity: 0.8; }
      50%      { opacity: 1; }
    }

    /* ---- SNOW THEME shapes ---- */
    .mountain {
      position: absolute;
      bottom: 0;
      width: 0;
      height: 0;
      border-left: 90px solid transparent;
      border-right: 90px solid transparent;
      border-bottom: 150px solid rgba(255,255,255,0.08);
    }

    /* ---- SPACE THEME shapes ---- */
    .star {
      position: fixed;
      width: 2px;
      height: 2px;
      background: white;
      border-radius: 50%;
      z-index: 0;
      animation: starTwinkle 2.5s ease-in-out infinite;
    }
    @keyframes starTwinkle {
      0%, 100% { opacity: 0.2; }
      50%      { opacity: 1; }
    }
    .moon {
      position: fixed;
      top: 30px;
      right: 60px;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: #f5f5dc;
      box-shadow: 0 0 30px rgba(245,245,220,0.6);
      z-index: 0;
    }

    /* ===================================================================
       AMBIENT PARTICLES - theme onujayi direction/color change hobe
       (upore vasha, niche pora, ba pashe drift kora)
    =================================================================== */
    .particle {
      position: fixed;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      opacity: 0.6;
      pointer-events: none;
      z-index: 0;
      animation-timing-function: linear;
      animation-iteration-count: infinite;
    }
    @keyframes floatUp {
      0%   { transform: translateY(0) translateX(0); opacity: 0.8; }
      100% { transform: translateY(-100vh) translateX(20px); opacity: 0; }
    }
    @keyframes fallDown {
      0%   { transform: translateY(0) translateX(0); opacity: 0.9; }
      100% { transform: translateY(100vh) translateX(-15px); opacity: 0; }
    }
    @keyframes driftSide {
      0%   { transform: translateX(0); opacity: 0.7; }
      100% { transform: translateX(110vw); opacity: 0; }
    }

    /* ===================================================================
       HEADER
    =================================================================== */
    h1 {
      margin-bottom: 4px;
      z-index: 1;
      text-shadow: 0 0 10px var(--accent), 0 0 20px var(--accent);
      animation: fadeDown 0.6s ease;
    }
    .subtitle {
      z-index: 1;
      font-size: 12px;
      opacity: 0.85;
      margin-bottom: 12px;
      text-align: center;
    }
    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ===================================================================
       SCOREBOARD
    =================================================================== */
    .scoreboard {
      display: flex;
      gap: 14px;
      margin-bottom: 10px;
      font-size: 14px;
      z-index: 1;
      flex-wrap: wrap;
      justify-content: center;
      animation: fadeDown 0.8s ease;
    }
    .score-box {
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid var(--accent);
      padding: 8px 14px;
      border-radius: 8px;
      text-align: center;
      transition: transform 0.2s ease, background 0.2s ease;
    }
    .score-box.pulse {
      transform: scale(1.2);
      background: var(--accent);
      color: black;
    }
    .score-box span {
      display: block;
      font-size: 18px;
      font-weight: bold;
      margin-top: 3px;
    }

    /* ===================================================================
       RANK/AWARD BADGE + PROGRESS BAR (level UNLIMITED, tai fixed
       badge row-er bodole ekta progress bar dekhabo next level porjonto)
    =================================================================== */
    .rank-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      z-index: 1;
      font-size: 14px;
    }
    .rank-icon {
      font-size: 20px;
      animation: badgeGlow 1.2s ease infinite alternate;
    }
    @keyframes badgeGlow {
      from { filter: drop-shadow(0 0 3px var(--accent)); }
      to   { filter: drop-shadow(0 0 12px var(--accent)); }
    }
    .progress-wrap {
      width: 220px;
      height: 10px;
      background: rgba(255,255,255,0.15);
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 15px;
      z-index: 1;
      border: 1px solid var(--accent);
    }
    .progress-fill {
      height: 100%;
      background: var(--accent);
      width: 0%;
      transition: width 0.6s ease;
      box-shadow: 0 0 10px var(--accent);
    }

    #status {
      margin-bottom: 15px;
      font-size: 16px;
      min-height: 22px;
      z-index: 1;
      text-align: center;
      padding: 0 20px;
    }

    /* ===================================================================
       GAME BOARD
    =================================================================== */
    .board {
      display: grid;
      grid-template-columns: repeat(3, 100px);
      grid-template-rows: repeat(3, 100px);
      gap: 6px;
      background: rgba(0, 0, 0, 0.45);
      padding: 6px;
      border: 2px solid var(--accent);
      border-radius: 10px;
      z-index: 1;
      animation: fadeUp 0.6s ease;
      transition: border-color 0.5s ease;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .cell {
      background: #1c1c30;
      border-radius: 6px;
      font-size: 42px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.1s ease;
    }
    .cell:hover {
      background: #2a2a45;
    }
    .cell.filled {
      cursor: default;
      animation: pop 0.25s ease;
    }
    @keyframes pop {
      0%   { transform: scale(0); }
      70%  { transform: scale(1.2); }
      100% { transform: scale(1); }
    }
    .cell.win {
      background: var(--accent);
      color: black;
      animation: winPulse 0.6s ease infinite alternate;
    }
    @keyframes winPulse {
      from { box-shadow: 0 0 5px var(--accent); }
      to   { box-shadow: 0 0 20px var(--accent); }
    }

    button.action-btn {
      margin-top: 20px;
      padding: 10px 25px;
      font-size: 15px;
      cursor: pointer;
      border: none;
      border-radius: 5px;
      background: var(--accent);
      z-index: 1;
      transition: transform 0.15s ease, background 0.2s ease;
    }
    button.action-btn:hover {
      transform: scale(1.05);
    }

    .shake {
      animation: shake 0.4s ease;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25%      { transform: translateX(-8px); }
      75%      { transform: translateX(8px); }
    }

    /* ===================================================================
       LEVEL UP / AWARD BANNER (PUBG "chicken dinner" / rank-up style)
    =================================================================== */
    .levelup-banner {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.78);
      z-index: 10;
      opacity: 0;
      pointer-events: none;
    }
    .levelup-banner.show {
      animation: bannerShow 2.4s ease forwards;
    }
    @keyframes bannerShow {
      0%   { opacity: 0; }
      10%  { opacity: 1; }
      85%  { opacity: 1; }
      100% { opacity: 0; }
    }
    .levelup-banner .trophy {
      font-size: 50px;
      animation: levelPop 0.6s ease;
    }
    .levelup-banner h2 {
      font-size: 40px;
      margin: 6px 0 0 0;
      color: var(--accent);
      text-shadow: 0 0 15px var(--accent), 0 0 30px var(--accent);
      animation: levelPop 0.6s ease;
    }
    .levelup-banner p {
      font-size: 18px;
      margin-top: 8px;
    }
    @keyframes levelPop {
      0%   { transform: scale(0.3) rotate(-8deg); opacity: 0; }
      60%  { transform: scale(1.2) rotate(3deg); opacity: 1; }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }
  </style>
</head>
<body id="body">

  <!-- ===================== ANIMATED SCENE BACKGROUND ===================== -->
  <!-- Ei container-er vitor theme onujayi (city/ocean/desert/snow/space)
       shape gulo JS diye bosano hobe -->
  <div class="scene" id="scene"></div>

  <!-- ===================== HEADER ===================== -->
  <h1>Tic Tac Toe</h1>
  <div class="subtitle">Unbeatable AI - Earn points for a Draw + Level Up (Unlimited Levels)</div>

  <!-- ===================== SCOREBOARD ===================== -->
  <div class="scoreboard">
    <div class="score-box" id="scorePointsBox">Points<span id="scorePoints">0</span></div>
    <div class="score-box" id="scoreLevelBox">Level<span id="scoreLevelNum">1</span></div>
    <div class="score-box" id="scoreDrawBox">Draws<span id="scoreDraw">0</span></div>
  </div>

  <!-- Rank/Award badge -->
  <div class="rank-row">
    <span class="rank-icon">🏆</span>
    <span id="rankLabel">Rookie</span>
    <span id="themeLabel">- Neon City</span>
  </div>
  <!-- Next level porjonto koto progress hoyeche - eta dekhanor bar -->
  <div class="progress-wrap">
    <div class="progress-fill" id="progressFill"></div>
  </div>

  <div id="status">Your turn (X) - You can't beat the AI, but a DRAW earns you points!</div>

  <div class="board" id="board"></div>

  <button class="action-btn" onclick="resetGame()">Restart</button>

  <!-- Level-up / Award popup banner -->
  <div class="levelup-banner" id="levelupBanner">
    <div class="trophy">🏆</div>
    <h2 id="levelupTitle">LEVEL UP!</h2>
    <p id="levelupSubtitle">New zone unlocked</p>
  </div>

  <script>
    /* =================================================================
       GAME STATE VARIABLES
    ================================================================= */
    let cells = ["", "", "", "", "", "", "", "", ""];
    let gameOver = false;

    let drawCount = 0;
    let points = 0;           // total point (level unlock-er base)
    let currentLevel = 1;     // level EKHON UNLIMITED - kono max nei

    const winPatterns = [
      [0,1,2], [3,4,5], [6,7,8],
      [0,3,6], [1,4,7], [2,5,8],
      [0,4,8], [2,4,6]
    ];

    /* =================================================================
       THEMES - PUBG city, Ocean, Desert, Snow, Space - ei 5 ta theme
       BAR BAR cycle korbe (level 6 abar city hobe, level 7 ocean...)
       Fole level UNLIMITED howa shotteo shudhu 5 ta theme diyei
       infinite variety toiri hoy
    ================================================================= */
    const themes = [
      { key: "city",   name: "Neon City",     bg1: "#0d0d1a", bg2: "#1b1b33", accent: "#ffcd05" },
      { key: "ocean",  name: "Ocean Horizon", bg1: "#001a2e", bg2: "#003554", accent: "#00e5ff" },
      { key: "desert", name: "Desert Dunes",  bg1: "#2b1a0d", bg2: "#4a2e14", accent: "#ff9d00" },
      { key: "snow",   name: "Snow Peaks",    bg1: "#0d1520", bg2: "#1c2b3a", accent: "#ffffff" },
      { key: "space",  name: "Night Sky",     bg1: "#05010f", bg2: "#150a2e", accent: "#ff00ff" }
    ];

    /* =================================================================
       RANK TITLES - PUBG-er rank system-er moto (Bronze, Silver,
       Gold, Platinum, Diamond, Crown, Ace, Conqueror). Protita
       3 level por por rank barbe. Conqueror-er por r rank barbe na,
       instead number bere cholbe (jehetu level unlimited)
    ================================================================= */
    const ranks = ["Rookie", "Bronze", "Silver", "Gold", "Platinum", "Diamond", "Crown", "Ace", "Conqueror"];

    /* =================================================================
       LEVEL-PROGRESSION FORMULA (UNLIMITED LEVEL SYSTEM)
       Fixed array-er bodole ekta FORMULA use korchi, tai level
       KONODIN SHESH hobe na - joto khushi level uthte parben.
       Protita level-e ager theke ektu beshi point lagbe (increasing
       difficulty), jate PUBG-r moto "rank up" korte kore kore
       kothin hote thake
    ================================================================= */
    function pointsToReachLevel(level) {
      // level 1 = 0 points (starting point)
      // proti level-e lagbe: 20 + (level number * 10) point
      // eta loop kore joog kore total ber kori
      let total = 0;
      for (let i = 1; i < level; i++) {
        total += 20 + i * 10;
      }
      return total;
    }

    /* =================================================================
       SCENE (BACKGROUND) DRAW KORA - current theme onujayi
       different shape (building/wave/dune/mountain/star) toiri kori
    ================================================================= */
    function renderScene(themeKey) {
      const scene = document.getElementById("scene");
      scene.innerHTML = ""; // age-r shape gulo shorie fela

      // Age-r theme-specific fixed element (sun/moon) thakle shoriye dei
      document.querySelectorAll(".sun, .moon").forEach(function (el) { el.remove(); });

      if (themeKey === "city") {
        // ---- CITY: building silhouette + jhikmik janala ----
        for (let i = 0; i < 40; i++) {
          const building = document.createElement("div");
          building.className = "building";
          const height = 40 + Math.random() * 140;
          const width = 20 + Math.random() * 35;
          building.style.height = height + "px";
          building.style.width = width + "px";

          const cols = Math.max(1, Math.floor(width / 10));
          const rows = Math.max(1, Math.floor(height / 15));
          for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
              if (Math.random() > 0.4) {
                const win = document.createElement("div");
                win.className = "window";
                win.style.left = (c * 10 + 4) + "px";
                win.style.bottom = (r * 15 + 4) + "px";
                win.style.animationDelay = (Math.random() * 4) + "s";
                building.appendChild(win);
              }
            }
          }
          scene.appendChild(building);
        }
      } else if (themeKey === "ocean") {
        // ---- OCEAN: layered wave shape, dhire dhire dole ----
        for (let i = 0; i < 3; i++) {
          const wave = document.createElement("div");
          wave.className = "wave";
          wave.style.height = (40 + i * 25) + "px";
          wave.style.opacity = (0.35 - i * 0.08);
          wave.style.animationDuration = (6 + i * 3) + "s";
          scene.appendChild(wave);
        }
      } else if (themeKey === "desert") {
        // ---- DESERT: balir dhibi (dune) + glowing sun ----
        for (let i = 0; i < 6; i++) {
          const dune = document.createElement("div");
          dune.className = "dune";
          dune.style.left = (i * 180 - 60) + "px";
          dune.style.width = (200 + Math.random() * 120) + "px";
          dune.style.height = (60 + Math.random() * 50) + "px";
          scene.appendChild(dune);
        }
        const sun = document.createElement("div");
        sun.className = "sun";
        document.body.appendChild(sun);
      } else if (themeKey === "snow") {
        // ---- SNOW: dhoja/mountain silhouette (triangle shapes) ----
        for (let i = 0; i < 12; i++) {
          const mountain = document.createElement("div");
          mountain.className = "mountain";
          mountain.style.marginRight = "-30px";
          const scale = 0.6 + Math.random() * 0.8;
          mountain.style.transform = "scale(" + scale + ")";
          mountain.style.transformOrigin = "bottom";
          scene.appendChild(mountain);
        }
      } else if (themeKey === "space") {
        // ---- SPACE: jhikmik tara (star) + moon ----
        for (let i = 0; i < 60; i++) {
          const star = document.createElement("div");
          star.className = "star";
          star.style.left = Math.random() * 100 + "vw";
          star.style.top = Math.random() * 70 + "vh";
          star.style.animationDelay = (Math.random() * 3) + "s";
          document.body.appendChild(star);
        }
        const moon = document.createElement("div");
        moon.className = "moon";
        document.body.appendChild(moon);
      }
    }

    /* =================================================================
       AMBIENT PARTICLES - theme onujayi direction/color/style change
       hobe (city/space = upore vashe, snow = niche pore, ocean =
       aste aste bubble upore othe, desert = pashe pashe bali/dust ure)
    ================================================================= */
    function renderParticles(themeKey) {
      // age-r particle gulo shoriye fela
      document.querySelectorAll(".particle").forEach(function (p) { p.remove(); });

      const total = 18;
      for (let i = 0; i < total; i++) {
        const dot = document.createElement("div");
        dot.className = "particle";

        if (themeKey === "snow") {
          // Snow: shada tushar niche porbe
          dot.style.background = "white";
          dot.style.boxShadow = "0 0 6px white";
          dot.style.top = "-10px";
          dot.style.left = Math.random() * 100 + "vw";
          dot.style.animationName = "fallDown";
          dot.style.animationDuration = (6 + Math.random() * 5) + "s";
        } else if (themeKey === "desert") {
          // Desert: dust pashe pashe ure jabe
          dot.style.background = "#ffd9a0";
          dot.style.boxShadow = "0 0 6px #ffd9a0";
          dot.style.top = (60 + Math.random() * 30) + "vh";
          dot.style.left = "-10px";
          dot.style.animationName = "driftSide";
          dot.style.animationDuration = (7 + Math.random() * 5) + "s";
        } else if (themeKey === "ocean") {
          // Ocean: bubble aste aste upore othe
          dot.style.background = "rgba(0, 229, 255, 0.8)";
          dot.style.boxShadow = "0 0 8px #00e5ff";
          dot.style.bottom = "-10px";
          dot.style.left = Math.random() * 100 + "vw";
          dot.style.animationName = "floatUp";
          dot.style.animationDuration = (7 + Math.random() * 6) + "s";
        } else {
          // City / Space: accent color-e glow kore upore vashbe
          dot.style.background = "var(--accent)";
          dot.style.boxShadow = "0 0 10px var(--accent), 0 0 20px var(--accent)";
          dot.style.bottom = "-10px";
          dot.style.left = Math.random() * 100 + "vw";
          dot.style.animationName = "floatUp";
          dot.style.animationDuration = (5 + Math.random() * 6) + "s";
        }

        dot.style.animationTimingFunction = "linear";
        dot.style.animationIterationCount = "infinite";
        dot.style.animationDelay = (Math.random() * 5) + "s";
        document.body.appendChild(dot);
      }
    }

    /* =================================================================
       BOARD DRAW KORA
    ================================================================= */
    function drawBoard() {
      const board = document.getElementById("board");
      board.innerHTML = "";
      cells.forEach(function (value, index) {
        const cellDiv = document.createElement("div");
        cellDiv.className = "cell" + (value ? " filled" : "");
        cellDiv.innerText = value;
        cellDiv.onclick = function () { handleClick(index); };
        board.appendChild(cellDiv);
      });
    }

    /* =================================================================
       CLICK HANDLE - human always X, computer always O (unbeatable AI)
    ================================================================= */
    function handleClick(index) {
      if (cells[index] !== "" || gameOver) {
        return;
      }

      cells[index] = "X";
      drawBoard();

      const result = getWinner(cells);
      if (result) {
        finishGame(result);
        return;
      }

      document.getElementById("status").innerText = "Computer is thinking...";

      // 400ms delay diye computer chal debe - "bhabche" emon feel
      setTimeout(function () {
        const cpuMove = getBestMove(cells);
        if (cpuMove !== -1) {
          cells[cpuMove] = "O";
          drawBoard();
        }
        const result2 = getWinner(cells);
        if (result2) {
          finishGame(result2);
        } else {
          document.getElementById("status").innerText = "Your turn (X)";
        }
      }, 400);
    }

    /* =================================================================
       WINNER/DRAW CHECK
    ================================================================= */
    function getWinner(board) {
      for (let i = 0; i < winPatterns.length; i++) {
        const [a, b, c] = winPatterns[i];
        if (board[a] !== "" && board[a] === board[b] && board[b] === board[c]) {
          return { winner: board[a], pattern: winPatterns[i] };
        }
      }
      if (!board.includes("")) {
        return { winner: "draw", pattern: [] };
      }
      return null;
    }

    /* =================================================================
       GAME SHESH HOLE EI FUNCTION CHOLBE
       AI unbeatable, tai DRAW-ke e "win" hisebe dhore point deya hoy
       (perfect AI-r biruddhe draw kora e shorbochcho orjon)
    ================================================================= */
    function finishGame(result) {
      gameOver = true;
      const statusEl = document.getElementById("status");

      if (result.winner === "draw") {
        statusEl.innerText = "Draw! That's the best result against this AI - +10 Points!";
        drawCount++;
        points += 10;

        document.getElementById("scoreDraw").innerText = drawCount;
        document.getElementById("scorePoints").innerText = points;
        pulseScore("scoreDrawBox");
        pulseScore("scorePointsBox");

        checkLevelUp();
      } else if (result.winner === "O") {
        // BUG FIX: age ekhane shudhu "shake" hoto, kintu winning
        // 3 ta ghor-e ".win" class (holud glow animation) add
        // kora hoyni - tai popup/color effect dekha jachhilo na.
        // Ekhon draw-er moto e winning cell 3 ta highlight korbo.
        const cellDivs = document.querySelectorAll(".cell");
        result.pattern.forEach(function (i) {
          cellDivs[i].classList.add("win");
        });

        statusEl.innerText = "Computer wins! Hit Restart to try again.";
        document.querySelector(".board").classList.add("shake");
        setTimeout(function () {
          document.querySelector(".board").classList.remove("shake");
        }, 400);
      } else {
        // "X" winner - normally minimax thik thakle eta hobar kotha na
        statusEl.innerText = "You won! (This shouldn't normally happen)";
      }
    }

    /* =================================================================
       SCORE BOX PULSE ANIMATION
    ================================================================= */
    function pulseScore(boxId) {
      const box = document.getElementById(boxId);
      box.classList.add("pulse");
      setTimeout(function () {
        box.classList.remove("pulse");
      }, 300);
    }

    /* =================================================================
       LEVEL UP CHECK - UNLIMITED LEVEL SYSTEM
       Points onujayi while loop diye dekhi koyta level cross hoyeche
       (jodi ekbare onek point ashe, tahole multiple level ekshathe
       barte pare - while loop eta shamlabe)
    ================================================================= */
    function checkLevelUp() {
      let leveledUp = false;

      while (points >= pointsToReachLevel(currentLevel + 1)) {
        currentLevel++;
        leveledUp = true;
      }

      if (leveledUp) {
        applyLevelVisuals();
        showLevelUpBanner();
      }

      updateProgressBar();
    }

    /* =================================================================
       CURRENT LEVEL-ER THEME (color + scene + particle) APPLY KORA
       - themeIndex = level number-ke theme list-er length diye mod
         kore ber kora hoy, tai 5 ta theme INFINITE bar cycle hobe
    ================================================================= */
    function applyLevelVisuals() {
      const themeIndex = (currentLevel - 1) % themes.length;
      const theme = themes[themeIndex];
      const body = document.getElementById("body");

      body.style.setProperty("--bg1", theme.bg1);
      body.style.setProperty("--bg2", theme.bg2);
      body.style.setProperty("--accent", theme.accent);

      document.getElementById("scoreLevelNum").innerText = currentLevel;
      document.getElementById("themeLabel").innerText = "- " + theme.name;
      document.getElementById("rankLabel").innerText = getRankLabel();

      renderScene(theme.key);
      renderParticles(theme.key);
    }

    /* =================================================================
       RANK LABEL - proti 3 level por notun rank, Conqueror-er por
       theke number diye continue hobe (PUBG-er "Conqueror" system-er
       moto - shorbocho rank-er porew khela cholte thake)
    ================================================================= */
    function getRankLabel() {
      const rankIndex = Math.min(Math.floor((currentLevel - 1) / 3), ranks.length - 1);
      const rankName = ranks[rankIndex];
      if (rankIndex === ranks.length - 1) {
        return rankName + " " + (currentLevel - (ranks.length - 1) * 3);
      }
      return rankName;
    }

    /* =================================================================
       PROGRESS BAR - current level theke next level porjonto koto
       percent hoyeche eta visually dekhano
    ================================================================= */
    function updateProgressBar() {
      const currentThreshold = pointsToReachLevel(currentLevel);
      const nextThreshold = pointsToReachLevel(currentLevel + 1);
      const earnedInThisLevel = points - currentThreshold;
      const neededForThisLevel = nextThreshold - currentThreshold;
      const percent = Math.min(100, (earnedInThisLevel / neededForThisLevel) * 100);
      document.getElementById("progressFill").style.width = percent + "%";
    }

    /* =================================================================
       LEVEL-UP / AWARD BANNER SHOW KORA (PUBG rank-up style popup)
    ================================================================= */
    function showLevelUpBanner() {
      const banner = document.getElementById("levelupBanner");
      const themeIndex = (currentLevel - 1) % themes.length;
      const theme = themes[themeIndex];

      document.getElementById("levelupTitle").innerText = "LEVEL " + currentLevel + " UNLOCKED!";
      document.getElementById("levelupSubtitle").innerText = getRankLabel() + " Rank - " + theme.name + " Zone";

      banner.classList.remove("show");
      void banner.offsetWidth; // reflow force kore animation restart
      banner.classList.add("show");
    }

    /* =================================================================
       MINIMAX ALGORITHM - "UNBEATABLE AI" er core
       - Computer (O)-er shob shombhabbo chal recursively check kore
       - Computer jitle score +, human jitle score -, draw hole 0
       - Computer shobshomoy MAX score dey emon chal nibe (Human o
         best khelbe emon dhore), fole human kokhono jitte parbe na
    ================================================================= */
    function getBestMove(board) {
      let bestScore = -Infinity;
      let move = -1;

      for (let i = 0; i < 9; i++) {
        if (board[i] === "") {
          board[i] = "O";
          const score = minimax(board, 0, false);
          board[i] = "";
          if (score > bestScore) {
            bestScore = score;
            move = i;
          }
        }
      }
      return move;
    }

    function minimax(board, depth, isMaximizing) {
      const result = getWinner(board);
      if (result) {
        if (result.winner === "O") return 10 - depth;
        if (result.winner === "X") return depth - 10;
        return 0;
      }

      if (isMaximizing) {
        let best = -Infinity;
        for (let i = 0; i < 9; i++) {
          if (board[i] === "") {
            board[i] = "O";
            best = Math.max(best, minimax(board, depth + 1, false));
            board[i] = "";
          }
        }
        return best;
      } else {
        let best = Infinity;
        for (let i = 0; i < 9; i++) {
          if (board[i] === "") {
            board[i] = "X";
            best = Math.min(best, minimax(board, depth + 1, true));
            board[i] = "";
          }
        }
        return best;
      }
    }

    /* =================================================================
       GAME RESTART - board khali hobe, kintu points/level/rank
       shobkichu thake jabe (progress hariye jabe na)
    ================================================================= */
    function resetGame() {
      cells = ["", "", "", "", "", "", "", "", ""];
      gameOver = false;
      document.getElementById("status").innerText = "Your turn (X) - You can't beat the AI, but a DRAW earns you points!";
      drawBoard();
    }

    /* =================================================================
       INITIAL SETUP - page load hole shuru hobe
    ================================================================= */
    applyLevelVisuals();   // Level 1 (Neon City) diye shuru
    updateProgressBar();
    drawBoard();
  </script>
